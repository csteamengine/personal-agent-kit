# Browser lease, per-session mode. Copy to $ORCA_KIT_CONFIG/leases/browser.conf
# only after registering chrome-mcp-per-worktree.sh as your chrome-devtools MCP command.
# Without this file the browser lease runs in shared mode at capacity 1.
CAP=3
PORTS="8080 8081 8082"
BUSY_PATTERN="user-data-dir={profile}"
GRACE=900
